name: Bug report
description: Report reproducible Cena behavior
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Version, device, relevant sanitized logs. Never paste tokens, personal data or private images.
  - type: textarea
    id: impact
    attributes:
      label: Severity, affected users and regression tests
